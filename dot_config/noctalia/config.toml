[accessibility]
ui_scale = 0.9

[shell]
polkit_agent = true
font_family = "Inter"

[bar.default]
smart_auto_hide = true
reserve_space = false
start = ["workspaces"]
center = ["launcher", "control-center", "clock", "notifications", "clipboard"]
end = ["tray", "sysmon", "volume", "network", "battery"]

[plugins]
enabled = ["kenn/keybind-cheatsheet"]

[plugin_settings."kenn/keybind-cheatsheet"]
compositor = "niri"
show_undescribed = false

[audio]
enable_volume_sounds = false

[notification]
filter_order = ["niri-screenshot"]

[notification.filter.niri-screenshot]
enabled = true
match = "niri"
match_content = "Screenshot captured"
show_toast = false
save_history = false
play_sound = false
