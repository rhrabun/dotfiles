[settings]
minimum_release_age = "7d"
not_found_auto_install = false
tool_update.global_auto = true
locked_verify_provenance = true

[tools]
gh = "latest"
uv = "latest"
go = "latest"
ruff = "latest"
awscli = "latest"
lazygit = "latest"
terraform = "1.16"
pre-commit="latest"
lazydocker = "latest"

node = { version = "latest", os = ["linux"] }
zellij = { version = "latest", os = ["linux"] }
opencode = { version = "latest", os = ["linux"], depends = ["node"] }
