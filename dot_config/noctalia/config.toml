[accessibility]
ui_scale = 0.9

[shell]
polkit_agent = true
font_family = "Inter"

[bar.default]
smart_auto_hide = true
reserve_space = false
start = ["control-center", "launcher", "workspaces"]
center = ["clipboard", "clock", "notifications"]
end = ["tray", "sysmon", "volume", "network", "battery"]
