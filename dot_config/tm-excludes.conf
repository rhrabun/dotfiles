# Time Machine exclusion list, applied by ~/.local/bin/tm-excludes

# caches / logs
~/Library/Caches
~/Library/Logs
~/.cache
~/.npm
~/.bun/install/cache
~/Library/Application Support/Code/CachedData
~/Library/Application Support/Code/logs

# large, re-downloadable
~/.vscode/extensions
~/.local/share/mise/downloads
~/.local/share/mise/installs
~/.local/share/zinit
~/Library/Application Support/Telegram Desktop
